# SubSignature for HCL Domino - configuration of the server agent
#
# Put this file into the Domino data directory of the server(s) that run the
# agent (e.g. D:\HCL\Domino\Data\subsignature-domino.ini): in central mode only
# on agent_server, otherwise on every mail server listed under "servers".
# Lines starting with # are comments; "key = value", one setting per line.
# The file contains the API token: only Domino administrators should be able
# to read it.

# Address of the SubSignature server (https only).
url = https://subsignature.example.com

# API token (Admin -> API Tokens) with "Read signatures" and, for the status
# report, "Report sync status".
token = ssg_REPLACE_ME

# Domino servers whose mail files get the signatures, separated by commas.
# Common name (domino-hub), abbreviated (domino-hub/Example) or canonical
# name; organizational units may be left out.
# Example: servers = domino-mail1/Example
servers =

# Central mode: the ONE server that does the work for all servers listed above.
# It changes the mail files on the other servers over the network; those servers
# must list it under "Trusted servers" (server document -> Security).
# Empty: every server listed above handles only its own mail files (the agent
# and this file are then needed on each of them).
# Example: servers = domino-mail1/Example, domino-mail2/Example
#          agent_server = domino-hub/Example
agent_server =

# SHOW       dry run: shows what would be written, changes nothing
# APPLY      writes the signatures into the mail files
# RESTORE    puts back the signature from before SubSignature (needs test_address)
# EXPORT_DXL writes the signature of test_address as DXL into
#            subsignature-signature.dxl in the data directory (diagnosis)
mode = SHOW

# Only this one mail file (Internet address of its owner). Empty = all mail
# files (of the servers above) whose owner has a signature in SubSignature.
test_address =

# At most this many signatures per run: the first ones found, in the order of
# the SubSignature IDs. 0 = no limit.
limit = 10

# A signature that was written by the agent and is deleted in SubSignature later
# (also: owner deactivated or address changed):
#   keep     the signature stays in Notes, the mail file is no longer managed
#   restore  the signature from before SubSignature is put back
#   remove   the signature is removed and switched off
# Checked only in runs over all mail files (no test_address, limit not reached).
on_deleted = keep

# Report the result to SubSignature (All Signatures shows "Domino <server>").
report_status = true

# true: write every signature again, even if it did not change (e.g. after a
# picture was replaced under the same name). Normally false.
force_update = false

# The agent stops after this many minutes and continues in the next run.
# Keep it below the Agent Manager's maximum run time. 0 = no own limit.
max_minutes = 30

# Domino Directory on this server.
directory = names.nsf
